# Export from noctalia settings: noctalia config export
# Noctalia settings (generated by settings app): ~/.local/state/noctalia/settings.toml
# Don't recommend hard-wiring this; use settings app instead.
# config_version = 1
[audio]
enable_sounds = true

[bar.default]
start = [ "launcher", "workspaces" ]

[location]
auto_locate = true

[notification]
history_retention_hours = 24

[shell]
font_family = "Iosevka Aile"

[theme]
builtin = "Dracula"
mode = "auto"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "niri", "umbriel" ]

[weather]
unit = "imperial"

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%a %b %d | %I:%M %p}"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.volume]
mute_color = "secondary"
show_label = false