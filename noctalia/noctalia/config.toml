# Export from noctalia settings: noctalia config export
# Noctalia settings (generated by settings app): ~/.local/state/noctalia/settings.toml
# Don't recommend hard-wiring this; use settings app instead.

[bar.default]
start = [ "launcher", "workspaces" ]

[location]
auto_locate = true

[shell]
font_family = "Iosevka Aile"

[theme]
mode = "auto"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "emacs", "gtk3", "gtk4", "niri" ]

[weather]
unit = "imperial"

[widget.brightness]
show_label = false

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.volume]
mute_color = "secondary"
show_label = false